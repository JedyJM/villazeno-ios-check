<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">

<title>Restauration | Villa Zen’O</title><meta name="theme-color" content="#F5EFE6"><link rel="stylesheet" href="zeno.css"><style>
.picks{display:grid;gap:8px;flex:none}
.picks.n2{grid-template-columns:1fr 1fr}.picks.n3{grid-template-columns:repeat(3,1fr)}
.pick{position:relative;height:clamp(84px,12svh,104px);border:1px solid var(--sable);border-radius:var(--r);background:var(--lin);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:500 13.5px/1.15 var(--sans);color:var(--encre);text-align:center;padding:0 6px}
.pick .plume-p{width:44px;height:44px;color:#2B2420}
.pick[aria-pressed=true],.pick[aria-checked=true]{background:var(--palmeraie);border-color:var(--palmeraie);color:var(--lin)}
.pick[aria-pressed=true] .plume-p,.pick[aria-checked=true] .plume-p{color:#F1E4D0}
.pick .ok{position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:50%;background:#F1E4D0;color:var(--palmeraie);display:grid;place-items:center}
.pick .ok svg{width:12px;height:12px}
.lbl-s{font:500 9.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--taupe);flex:none}
.addnote{align-self:flex-start;font:500 13.5px/1 var(--sans);color:var(--pise);padding:12px 0 4px;flex:none}
.btn.full{width:100%;margin-top:auto;flex:none}.note2{margin-bottom:var(--gap)}
.note2{width:100%;height:clamp(64px,10svh,88px);border:1px solid var(--sable);border-radius:var(--r);background:var(--lin);padding:12px;font:400 16px/1.35 var(--sans);resize:none;flex:none;color:var(--encre)}
.note2::placeholder{color:#776B5F}.note2:focus{outline:none;border-color:var(--pise)}
.picks.grow{flex:none;height:clamp(96px,22svh,160px)}.picks.n3.grow{height:clamp(90px,19svh,140px)}.picks.grow .pick{height:auto}
.picks.grow .plume-p{width:clamp(40px,10svh,80px);height:clamp(40px,10svh,80px)}.picks.n3.grow .plume-p{width:clamp(36px,8svh,64px);height:clamp(36px,8svh,64px)}
.confirm{font:400 11.5px/1.2 var(--sans);color:var(--taupe);text-align:center;margin-top:6px;flex:none}
.free{font:400 11.5px/1.2 var(--sans);color:var(--taupe);text-align:center;margin-top:6px;flex:none}
.card{border:1px solid var(--sable);border-radius:var(--r);background:var(--lin);padding:10px 12px;flex:none}
.heat{display:flex;align-items:center;gap:10px}
.heat .plume-h{width:34px;height:34px;color:#2B2420;flex:none}
.heat strong{display:block;font:400 16px/1.15 var(--serif)}
.heat span{display:block;font:400 12px/1.3 var(--sans);color:var(--taupe);margin-top:2px}
.heat b{color:var(--encre);font-weight:500}
.routes{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}
.route{border:1px solid var(--sable);border-radius:var(--r);background:var(--lin);padding:9px 10px}
.route.reco{border-color:var(--palmeraie)}
.route .top{display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.route strong{font:400 16px/1.1 var(--serif);white-space:nowrap}
.route .tag{font:500 10px/1 var(--sans);color:var(--palmeraie);white-space:nowrap}
.route .via{display:block;font:500 12.5px/1.2 var(--sans);color:var(--pise);margin-top:4px}
.route p{font:400 11.5px/1.3 var(--sans);color:var(--taupe);margin-top:3px}
.warn{display:flex;gap:8px;align-items:flex-start;border-left:2px solid var(--pise);padding:4px 0 4px 10px;font:400 12px/1.3 var(--sans);color:var(--encre);flex:none}
.warn b{font-weight:500;color:var(--pise)}
.map{flex:1;min-height:90px;border-radius:var(--r);overflow:hidden;border:1px solid var(--sable)}
.map img{width:100%;height:100%;object-fit:cover;display:block}
.go{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}
.go .btn{width:100%;padding:0 10px;text-decoration:none}
.route .eb{display:block;font:500 9.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--taupe);margin-bottom:5px}.route.reco .eb{color:var(--palmeraie)}
.route .min{font:400 12px/1 var(--sans);color:var(--taupe);white-space:nowrap}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(35,31,27,.42)}
.sheet{z-index:51;position:fixed;left:0;right:0;bottom:0;max-height:88svh;background:var(--chaux);border-radius:14px 14px 0 0;padding:8px var(--m) calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--sable);margin:0 auto 8px}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head h2{font:400 24px/1 var(--serif)}
.sheet-head button{font:500 13.5px/1 var(--sans);color:var(--pise)}
.sheet h3{margin-top:12px}
.crow{display:flex;align-items:center;gap:10px;height:clamp(42px,6svh,48px);border-bottom:1px solid var(--sable-2)}
.crow:last-child{border-bottom:0}
.crow .who{flex:1;min-width:0;font:400 14.5px/1.15 var(--sans)}
.crow .who small{display:block;font:400 11px/1.2 var(--sans);color:var(--taupe)}
.crow .num{font:400 13.5px/1 var(--sans);color:var(--taupe);font-variant-numeric:tabular-nums;white-space:nowrap}
.crow .num i{font-style:normal;font-size:11px}
.crow .act{width:32px;height:32px;border-radius:50%;border:1px solid var(--sable);display:grid;place-items:center;color:var(--pise);flex:none}
.crow .act svg{width:16px;height:16px}
.crow.main .act{background:var(--palmeraie);border-color:var(--palmeraie);color:var(--lin)}
@media (max-height:620px){
  .note2{height:52px;padding:8px 12px}
  .pick{height:70px}.pick .plume-p{width:32px;height:32px}
  .route{padding:6px 8px}.route p{font-size:11px}
  .sheet h3{margin-top:8px}.crow{height:36px}.sheet-head h2{font-size:21px}
}
